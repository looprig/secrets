name: Documentation examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run secret safety example
        run: GOWORK=off go run ./examples/secret-safety
      - name: Run reference example
        run: GOWORK=off go run ./examples/references
      - name: Run local store example
        run: GOWORK=off go run ./examples/local-store
      - name: Run store contract example
        run: GOWORK=off go test ./examples/contracttest -run '^TestLocalStoreContract$' -count=1
      - name: Run race suite
        run: GOWORK=off go test -race ./...
